<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>YouTube — KINOTOP</title>
  <link rel="icon" href="../assets/icons/favicon.png" type="image/png" />
  <style>
    html, body {
      margin: 0; min-height: 100%;
      background: #0b0620; color: #fff;
      font-family: system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
    }
    .box { padding: 24px; max-width: 420px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { opacity: 0.75; margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Открываем YouTube…</h1>
    <p id="msg">Подождите</p>
  </div>
  <script>
    (function () {
      function qs(n) { return new URLSearchParams(location.search).get(n); }
      function yt(url) {
        if (!url) return '';
        var m = String(url).match(/(?:v=|\/embed\/|youtu\.be\/)([\w-]{11})/);
        if (m) return 'https://www.youtube.com/watch?v=' + m[1] + '&hl=ru&gl=RU&cc_lang_pref=ru';
        return url;
      }
      function open(m) {
        var url = yt((m && (m.trailer || m.youtube || m.video)) || '');
        if (!url) {
          document.getElementById('msg').textContent = 'Ссылка YouTube не найдена';
          return;
        }
        location.replace(url);
      }
      function fromJson() {
        fetch('../data/movies.json?v=ytGo2').then(function (r) { return r.json(); }).then(function (data) {
          var list = (data && data.movies) || data || [];
          open(list.find(function (x) { return String(x.id) === String(qs('id')); }));
        }).catch(function () {
          document.getElementById('msg').textContent = 'Ошибка загрузки';
        });
      }
      var s = document.createElement('script');
      s.src = '../js/embedded-data.js?v=ytGo2';
      s.onload = function () {
        var list = ((window.KinoBoom_EMBEDDED || {}).movies) || [];
        var m = list.find(function (x) { return String(x.id) === String(qs('id')); });
        if (m) open(m); else fromJson();
      };
      s.onerror = fromJson;
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
