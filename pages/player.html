<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Фильм — KINOTOP</title>
  <link rel="icon" href="../assets/icons/favicon.png" type="image/png" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/grid.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="player-page">
  <div class="player-wrapper">
    <a class="player-back" href="../index.html" aria-label="Назад">← Назад</a>
    <h1 class="player-title">Загрузка фильма…</h1>
    <video id="video-player" playsinline controls></video>
    <div class="player-controls">
      <div class="player-progress">
        <div class="player-progress__buffered"></div>
        <div class="player-progress__played"></div>
        <div class="player-progress__thumb"></div>
      </div>
      <div class="player-controls__row">
        <button type="button" data-player="play" aria-label="Play">▶</button>
        <button type="button" data-player="stop" aria-label="Stop">⏹</button>
        <span data-player="time-current">0:00</span>
        <span>/</span>
        <span data-player="time-total">0:00</span>
        <input type="range" data-player="volume" min="0" max="1" step="0.05" value="1" aria-label="Громкость" />
        <select data-player="speed" aria-label="Скорость">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
        <button type="button" data-player="pip" aria-label="PiP">PiP</button>
        <button type="button" data-player="fullscreen" aria-label="Fullscreen">⛶</button>
      </div>
    </div>
  </div>
  <script src="../js/boot.js?v=filmPlayer1" data-entry="player-page.js"></script>
</body>
</html>
